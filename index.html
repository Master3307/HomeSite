  <head>
    <meta charset="UTF-8" />

    <!-- Apply the saved theme before the page renders. -->
    <script>
      (() => {
        const root = document.documentElement;
        let theme = "dark";

        try {
          const savedTheme = localStorage.getItem("preferredTheme");

          if (savedTheme === "light" || savedTheme === "dark") {
            theme = savedTheme;
          } else if (savedTheme === "system") {
            theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          const prefs = JSON.parse(localStorage.getItem("homesite:prefs") || "{}");
          // Animations: "none" switches them off before anything moves.
          if (prefs.motion === "reduce" || prefs.motion === "none") root.classList.add("motion-reduce");
          if (prefs.motion === "none") root.classList.add("motion-none");
          // The member's own colour (main.css :root.has-accent), so it doesn't flash in late.
          if (/^#[0-9a-f]{6}$/i.test(prefs.accent || "")) {
            root.classList.add("has-accent");
            root.style.setProperty("--user-tint", prefs.accent);
          }
        } catch {
          // Keep the dark default if storage is unavailable.
        }

        root.setAttribute("data-theme", theme);

        root.style.setProperty(
          "--theme-progress",
          theme === "dark" ? "1" : "0",
        );
      })();
    </script>

    <!--
      Settings → "Block Cloudflare analytics" (src/lib/prefs.js): the Cloudflare
      tunnel adds a Web Analytics beacon to every page. When the visitor turns
      it off, the beacon script is kept from loading and nothing it would send
      (to cloudflareinsights.com or /cdn-cgi/rum) leaves the browser.
    -->
    <script>
      (() => {
        let block = false;
        try {
          block = JSON.parse(localStorage.getItem("homesite:prefs") || "{}").blockInsights === true;
        } catch {
          return;
        }
        if (!block) return;
        const blocked = (url) => /cloudflareinsights\.com|\/cdn-cgi\/rum/i.test(String(url && url.url ? url.url : url));
        const sendBeacon = navigator.sendBeacon && navigator.sendBeacon.bind(navigator);
        if (sendBeacon) navigator.sendBeacon = (url, data) => (blocked(url) ? true : sendBeacon(url, data));
        const fetchOriginal = window.fetch.bind(window);
        window.fetch = (input, init) => (blocked(input) ? Promise.resolve(new Response(null, { status: 204 })) : fetchOriginal(input, init));
        const open = XMLHttpRequest.prototype.open;
        XMLHttpRequest.prototype.open = function (method, url, ...rest) {
          if (blocked(url)) url = "data:text/plain,";
          return open.call(this, method, url, ...rest);
        };
        const stop = (node) => {
          if (node.tagName === "SCRIPT" && blocked(node.src)) {
            node.type = "javascript/blocked";
            node.remove();
          }
        };
        new MutationObserver((changes) => changes.forEach((change) => change.addedNodes.forEach(stop))).observe(document.documentElement, { childList: true, subtree: true });
      })();
    </script>
