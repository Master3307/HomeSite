<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="1026" viewBox="-20 -30 1150 1026" preserveAspectRatio="none" class="sparkly">
  <defs>
    <path id="heart" d="
      M550 295
      C475 140 375 65 260 65
      C115 65 35 175 35 320
      C35 525 235 735 550 940
      C865 735 1060 525 1060 320
      C1060 175 980 65 835 65
      C720 65 625 140 550 295
      Z"/>

    <!-- Pointed inner notch instead of a rounded join -->
    <path id="heart-inner" d="
      M550 350
      C535 324 520 295 496 255
      C430 145 350 105 260 105
      C145 105 78 190 78 325
      C78 493 207 657 365 743
      C426 776 492 802 550 808
      C608 802 674 776 735 743
      C893 657 1017 493 1017 325
      C1017 190 950 105 835 105
      C745 105 670 145 604 255
      C580 295 565 324 550 350
      Z"/>

    <path id="large-sparkle" d="
      M305 455
      Q326 455 331 490
      C348 587 389 627 479 646
      Q522 655 522 675
      Q522 695 479 704
      C389 723 348 763 331 860
      Q326 895 305 895
      Q284 895 279 860
      C262 763 221 723 131 704
      Q88 695 88 675
      Q88 655 131 646
      C221 627 262 587 279 490
      Q284 455 305 455
      Z"/>

    <!-- Transform applies to both the fill and outer border -->
    <path id="small-sparkle" transform="translate(20 -12)" d="
