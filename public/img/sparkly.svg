      Q903 35 909 66
      C924 141 954 175 1025 190
      Q1057 198 1057 217
      Q1057 236 1025 244
      C954 259 924 293 909 368
      Q903 399 885 399
      Q867 399 861 368
      C846 293 816 259 745 244
      Q713 236 713 217
      Q713 198 745 190
      C816 175 846 141 861 66
      Q867 35 885 35
      Z"/>

    <clipPath id="heart-inner-clip">
      <use href="#heart-inner"/>
    </clipPath>
  </defs>

  <!-- Outer border around the combined silhouette -->
  <g fill="#654b47" stroke="#654b47" stroke-width="76"
    stroke-linecap="round" stroke-linejoin="round">
    <use href="#heart"/>
    <use href="#large-sparkle"/>
    <use href="#small-sparkle"/>
  </g>

  <!-- Red rim and lower shadow -->
  <use href="#heart" fill="#ce2639"/>
  <use href="#heart-inner" fill="#ec4251"/>

  <g clip-path="url(#heart-inner-clip)" fill="#fb8283">
    <!-- Left crescent -->
    <path d="
      M78 325
      C78 190 145 105 260 105
      C350 105 430 145 496 255
      C504 269 496 280 481 271
      C407 226 345 207 274 215
      C199 223 144 266 119 326
      C111 348 97 352 87 341
      Q78 332 78 325
      Z"/>

    <!-- Right crescent -->
    <path d="
      M1017 325
      C1017 190 950 105 835 105
      C745 105 670 145 604 255
      C596 269 604 280 619 271
      C693 226 755 207 826 215
      C901 223 951 266 976 326
      C984 348 998 352 1008 341
      Q1017 332 1017 325
      Z"/>

    <!-- Small left-edge reflection -->
    <path d="
      M119 420
      C128 414 138 420 145 434
      Q166 477 193 508
      C206 523 200 536 188 534
      C169 530 139 489 115 444
      Q107 429 119 420
      Z"/>
  </g>

  <!-- Sparkles cover internal outline intersections -->
  <g fill="#fae280">
    <use href="#large-sparkle"/>
    <use href="#small-sparkle"/>
  </g>
</svg>