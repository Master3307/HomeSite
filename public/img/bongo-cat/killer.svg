      M728 223
      C598 211 473 253 415 353
      C353 461 399 574 493 627
      C586 680 737 684 862 641
      C984 599 1060 527 1061 434
      C1048 524 969 589 854 623
      C735 658 600 650 514 602
      C427 553 395 457 438 369
      C489 268 603 228 728 223 Z"/>

