  <!-- Cheeks -->
  <g fill="#f6dfdd">
    <ellipse cx="382" cy="530" rx="59" ry="47"/>
    <path d="M1015 580 Q1010 625 1055 645 Z"/>
  </g>

  <!-- Right mask strap -->
  <path fill="none"
    stroke="#624b4b"
    stroke-width="22"
    stroke-linecap="round"
    d="M981 333 L1063 285"/>

  <!-- Mask base -->
  <use href="#mask-shape" fill="#eeeae4"/>

  <g clip-path="url(#mask-clip)">
