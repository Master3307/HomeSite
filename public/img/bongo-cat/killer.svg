  <!-- Draw the outline last so shading cannot cover its inner edge -->
  <use href="#mask-shape"
    fill="none"
    stroke="#624b4b"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Original right paw -->
  <path fill="#fff"
    stroke="#624b4b"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
    d="
      M1110 682
      C1050 590 960 440 960 355
      C960 255 1080 250 1190 340
      L1280 425"/>

  <!-- Original paw pads -->
  <g fill="#fda690" clip-path="url(#left-paw-clip)">
    <ellipse cx="145" cy="495" rx="73" ry="74"/>
    <ellipse cx="70" cy="378" rx="38" ry="40"/>
    <circle cx="158" cy="363" r="31"/>
  </g>

  <g fill="#fda690" clip-path="url(#right-paw-clip)">
    <ellipse cx="1085" cy="503" rx="74" ry="75"/>
    <ellipse cx="1010" cy="386" rx="37" ry="40"/>
    <circle cx="1100" cy="373" r="31"/>
  </g>

  <!-- Left paw scratches -->
  <g clip-path="url(#left-paw-clip)"
     fill="none"
     stroke="#a68b80"
     stroke-width="6"
     stroke-linecap="round"
