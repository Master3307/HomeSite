    <path d="M131 472 L153 502"/>
    <path d="M145 465 L167 496"/>
    <path d="M158 471 L179 501"/>
    <path d="M123 487 L144 516"/>
    <path d="M235 580 L226 601"/>
    <path d="M247 585 L238 606"/>
    <path d="M258 589 L250 609"/>
  </g>

  <!-- Right paw scratches -->
  <g clip-path="url(#right-paw-clip)"
     fill="none"
     stroke="#a68b80"
     stroke-width="6"
     stroke-linecap="round"
     opacity=".85">
    <path d="M1066 480 L1089 511"/>
    <path d="M1080 473 L1104 505"/>
    <path d="M1094 481 L1115 511"/>
    <path d="M1058 494 L1080 523"/>
    <path d="M1142 603 L1162 610"/>
    <path d="M1147 616 L1167 623"/>
    <path d="M1153 629 L1172 635"/>
  </g>

  <!-- Original paw outlines -->
  <g fill="none"
     stroke="#624b4b"
     stroke-width="34"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path d="
      M165 675
      C110 595 20 425 20 345
      C20 245 145 230 260 330
      L345 410"/>

    <path d="
      M1110 682
      C1050 590 960 440 960 355
      C960 255 1080 250 1190 340
      L1280 425"/>
  </g>
</svg>