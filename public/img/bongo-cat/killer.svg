<svg xmlns="http://www.w3.org/2000/svg"
  width="1480"
  height="704"
  viewBox="0 0 1480 704"
  preserveAspectRatio="none"
  class="bobbing-cat">

  <defs>
    <clipPath id="left-paw-clip">
      <path d="
        M165 675
        C110 595 20 425 20 345
        C20 245 145 230 260 330
        L345 410 Z"/>
    </clipPath>

    <clipPath id="right-paw-clip">
      <path d="
        M1110 682
        C1050 590 960 440 960 355
        C960 255 1080 250 1190 340
        L1280 425 Z"/>
    </clipPath>

    <path id="mask-shape" d="
      M728 223
      C598 211 473 253 415 353
      C353 461 399 574 493 627
      C586 680 737 684 862 641
      C984 599 1060 527 1061 434
      C1063 339 951 252 840 232
      Q783 222 728 223 Z"/>

    <clipPath id="mask-clip">
      <use href="#mask-shape"/>
    </clipPath>
  </defs>

  <!-- Original cat silhouette -->
  <g stroke="#624b4b"
     stroke-width="34"
     stroke-linecap="round"
     stroke-linejoin="round">
    <path fill="#fff" d="
      M165 675
      Q190 360 470 205
      Q490 95 540 20
      Q620 30 720 130
      Q955 115 1150 215
      Q1250 155 1340 150
      Q1390 265 1390 445
      Q1470 565 1460 685 Z"/>

    <path fill="#fff" stroke="none" d="
      M165 675
      C110 595 20 425 20 345
      C20 245 145 230 260 330
      L345 410
      L205 658
      L175 658 Z"/>
  </g>

  <!-- Inner ears -->
  <g fill="#fda690">
    <path d="
      M525 195
      Q535 125 565 80
      Q630 105 675 155
      Q590 165 525 195 Z"/>

    <path transform="translate(-6 -6)" d="
      M1135 300
      Q1205 235 1305 228
      Q1335 330 1335 455
      Q1245 355 1135 300 Z"/>
  </g>

  <!-- Ear scratches -->
  <g fill="none"
     stroke="#ac8c80"
     stroke-width="6"
     stroke-linecap="round"
     opacity=".8">
    <path d="M565 122 L578 151"/>
    <path d="M583 115 L598 149"/>
    <path d="M602 130 L612 156"/>
    <path d="M1248 256 L1260 289"/>
    <path d="M1267 251 L1280 291"/>
    <path d="M1287 261 L1297 298"/>
