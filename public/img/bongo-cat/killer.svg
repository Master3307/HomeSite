    <g fill="#e95361">
      <path d="
        M595 358
        Q606 349 616 362
        L632 388
        Q640 402 629 410
        Q617 418 607 405
        L592 380
        Q584 367 595 358 Z"/>

      <path d="
        M832 367
        Q846 354 857 367
        Q866 378 853 389
        L833 405
        Q820 414 812 403
        Q805 393 817 382 Z"/>

      <path d="
        M567 558
        Q581 546 592 558
        Q600 568 588 578
        L575 587
        Q563 594 554 584
        Q548 575 559 565 Z"/>

      <path d="
        M854 568
        Q866 559 876 570
        L888 583
        Q895 593 883 600
        Q872 606 863 596
        L852 583
        Q846 576 854 568 Z"/>
    </g>

    <!-- Shorter, tapered left rim chip -->
    <path fill="#624b4b" d="
      M487 283
      Q505 272 521 267
      L518 282
      Q527 289 530 304
      L535 322
      L522 307
      L514 290
      L506 289
      L504 302
      Q503 307 498 305
      Q494 303 494 298
      L494 290 Z"/>

    <!-- Surface wear -->
    <g fill="none"
       stroke="#b5aaa1"
       stroke-width="4"
       stroke-linecap="round"
       opacity=".7">
      <path d="M436 510 L451 525"/>
      <path d="M432 524 L446 539"/>
      <path d="M737 366 L749 349"/>
      <path d="M745 372 L757 354"/>
      <path d="M623 613 L632 628"/>
      <path d="M635 612 L644 626"/>
