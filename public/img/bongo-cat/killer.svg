    <path fill="#faf8f3" opacity=".8" d="
      M457 332
      C527 261 637 236 743 243
      C828 247 900 270 953 310
      C890 280 816 266 741 264
      C634 259 533 280 457 332 Z"/>

    <!-- Eyes -->
    <g fill="#624b4b">
      <ellipse cx="526" cy="462"
        rx="72" ry="73"
        transform="rotate(-10 526 462)"/>
      <ellipse cx="930" cy="480"
        rx="72" ry="73"
        transform="rotate(11 930 480)"/>
    </g>

    <!-- Eight vents -->
    <g fill="#71615c">
      <ellipse cx="679" cy="302" rx="18" ry="19"/>
      <ellipse cx="753" cy="306" rx="18" ry="19"/>
      <ellipse cx="685" cy="439" rx="18" ry="20"/>
      <ellipse cx="759" cy="443" rx="18" ry="20"/>
      <ellipse cx="689" cy="519" rx="18" ry="20"/>
      <ellipse cx="763" cy="523" rx="18" ry="20"/>
      <ellipse cx="693" cy="596" rx="18" ry="20"/>
      <ellipse cx="767" cy="600" rx="18" ry="20"/>
    </g>

