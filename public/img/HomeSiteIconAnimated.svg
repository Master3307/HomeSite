<svg xmlns="http://www.w3.org/2000/svg"
  width="512"
  height="512"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="homesite-title homesite-description">

  <title id="homesite-title">HomeSite</title>
  <desc id="homesite-description">
    The purple HomeSite house pops up from its base, then the white H
    builds itself: the left stem, the right stem, and the crossbar
    snapping across. A glowing star runs along the whole roof, over the
    peak to the right shoulder, and spins away. A soft shine repeats.
  </desc>

  <defs>
    <path id="homesite-shape"
      d="
        M245 26
        Q256 21 267 26
        L451 109
        Q472 118 472 141
        V466
        Q472 492 446 492
        H66
        Q40 492 40 466
        V141
        Q40 118 61 109
        Z"/>

    <clipPath id="homesite-clip">
      <use href="#homesite-shape"/>
    </clipPath>

    <linearGradient id="surface-shading"
      x1="0%" y1="0%"
      x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".085"/>
      <stop offset="38%" stop-color="#FFFFFF" stop-opacity=".02"/>
      <stop offset="62%" stop-color="#140526" stop-opacity="0"/>
      <stop offset="100%" stop-color="#140526" stop-opacity=".12"/>
    </linearGradient>

    <linearGradient id="edge-shading"
      x1="0%" y1="0%"
      x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DEC7FF" stop-opacity=".22"/>
      <stop offset="45%" stop-color="#BD8AFF" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#140526" stop-opacity=".1"/>
    </linearGradient>

    <linearGradient id="shine-gradient"
      x1="0%" y1="0%"
      x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".075"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="star-halo">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".9"/>
      <stop offset="12%" stop-color="#F6EEFF" stop-opacity=".65"/>
      <stop offset="38%" stop-color="#D5B1FF" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#A566FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="star-reflection">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity=".3"/>
      <stop offset="35%" stop-color="#E1C8FF" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#C091FF" stop-opacity="0"/>
    </radialGradient>

    <filter id="star-glow"
      x="-150%" y="-150%"
      width="400%" height="400%"
      color-interpolation-filters="sRGB">
      <feGaussianBlur
        in="SourceGraphic"
        stdDeviation="1.9"
        result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- The whole roof: from the left eave over the peak to the right shoulder. -->
    <path id="star-route"
      d="
        M61 109
        L245 26
        Q256 21 267 26
        L451 109
        Q461.5 113.5 466.75 121.5"/>
  </defs>

  <style>
    /* The house pops up from its base with a small spring. */
    .house {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: pop-house .75s cubic-bezier(.34, 1.45, .64, 1) both;
    }

    /* The H builds itself: two stems rise, then the crossbar snaps across. */
    .stem {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: raise-stem .5s cubic-bezier(.22, 1.2, .36, 1) both;
    }
    .stem-left { animation-delay: .42s; }
    .stem-right { animation-delay: .56s; }

    .bar {
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: snap-bar .38s cubic-bezier(.3, 1.5, .5, 1) .9s both;
    }

    .shine {
      fill: url(#shine-gradient);
      opacity: 0;
      animation: slow-shine 9s linear 3s infinite both;
    }

    .star-appearance {
      opacity: 0;
      animation: star-appear 1.4s linear 1.3s both;
    }

    .star-burst {
      transform-box: view-box;
      transform-origin: 0 0;
      animation: star-twinkle 1.4s linear 1.3s both;
    }

    @keyframes pop-house {
      0% { opacity: 0; transform: translateY(18px) scale(.82); }
      35% { opacity: 1; }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes raise-stem {
      0% { transform: scaleY(0); }
      100% { transform: scaleY(1); }
    }

    @keyframes snap-bar {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }

    @keyframes slow-shine {
      0% { opacity: 0; transform: translateX(-340px) skewX(-16deg); }
      5%, 34% { opacity: 1; }
      42%, 100% { opacity: 0; transform: translateX(680px) skewX(-16deg); }
    }

    @keyframes star-appear {
      0% { opacity: 0; }
      10% { opacity: .85; }
      40% { opacity: 1; }
      70% { opacity: 1; }
      84% { opacity: .75; }
      100% { opacity: 0; }
    }

    @keyframes star-twinkle {
      0% { transform: rotate(-18deg) scale(.12); }
      20% { transform: rotate(-8deg) scale(.8); }
      62% { transform: rotate(0deg) scale(1.1); }
      70% { transform: rotate(12deg) scale(1.2); }
      84% { transform: rotate(105deg) scale(.8); }
      100% { transform: rotate(250deg) scale(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .shine,
      .star-effect {
        display: none;
        animation: none;
      }

      .house,
      .stem,
      .bar {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>

  <g opacity=".95" aria-hidden="true">
    <g class="house">
      <use href="#homesite-shape" fill="#5416A4"/>
      <use href="#homesite-shape" fill="url(#surface-shading)"/>

      <g clip-path="url(#homesite-clip)">
        <use
          href="#homesite-shape"
          fill="none"
          stroke="url(#edge-shading)"
          stroke-width="2"/>
      </g>

      <!-- The H in three parts (they overlap by a pixel, so no seams show). -->
      <g fill="#FFFFFF">
        <path class="stem stem-left" d="M128 170 H218 V450 H128 Z"/>
        <path class="stem stem-right" d="M294 170 H384 V450 H294 Z"/>
        <path class="bar" d="M217 267 H295 V353 H217 Z"/>
      </g>
    </g>

    <!-- A slow, repeating surface shine. -->
    <g clip-path="url(#homesite-clip)">
      <rect
        class="shine"
        x="0"
        y="0"
        width="280"
        height="512"/>
    </g>

    <!-- Reflected light stays inside the house silhouette. -->
    <g class="star-effect" clip-path="url(#homesite-clip)">
      <g>
        <animateMotion
          begin="1.3s"
          dur="1.4s"
          calcMode="spline"
          keyTimes="0;.7;1"
          keyPoints="0;1;1"
          keySplines=".3 .05 .3 1;0 0 1 1"
          fill="freeze">
          <mpath href="#star-route"/>
        </animateMotion>

        <g class="star-appearance">
          <ellipse
            cx="-9"
            cy="11"
            rx="36"
            ry="26"
            fill="url(#star-reflection)"/>
        </g>
      </g>
    </g>

    <!-- One star, one pass over the roof, ending with a spinning fade. -->
    <g class="star-effect">
      <g>
        <animateMotion
          begin="1.3s"
          dur="1.4s"
          calcMode="spline"
          keyTimes="0;.7;1"
          keyPoints="0;1;1"
          keySplines=".3 .05 .3 1;0 0 1 1"
          fill="freeze">
          <mpath href="#star-route"/>
        </animateMotion>

        <g class="star-appearance">
          <g class="star-burst">
            <circle r="22" fill="url(#star-halo)"/>

            <g filter="url(#star-glow)">
              <path
                fill="#FFFFFF"
                d="
                  M0 -17
                  C1 -4 2 -1.5 12 0
                  C2 1.5 1 4 0 17
                  C-1 4 -2 1.5 -12 0
                  C-2 -1.5 -1 -4 0 -17
                  Z"/>

              <circle r="1.9" fill="#FFFFFF"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
