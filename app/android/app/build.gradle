apply plugin: 'com.android.application'

/*
 * Everything owner-specific (package name, the site's host, the app name,
 * version, signing key) comes from ../homesite.properties, which
 * `pnpm app:build` (scripts/app-build.mjs) writes from .env. The Java code
 * lives in the neutral namespace org.homesite.app either way.
 */
def homesite = new Properties()
def homesiteFile = rootProject.file('homesite.properties')
if (homesiteFile.exists()) homesiteFile.withReader('UTF-8') { homesite.load(it) }
def hs = { String key, String fallback -> homesite.getProperty(key, fallback) }
def hasPush = file('google-services.json').exists()

android {
    namespace = "org.homesite.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode hs('versionCode', '1').toInteger()
        versionName hs('versionName', '1.0')
        manifestPlaceholders = [appHost: hs('appHost', 'localhost')]
        buildConfigField "boolean", "HAS_PUSH", hasPush ? "true" : "false"
        buildConfigField "String", "APP_HOST", "\"${hs('appHost', 'localhost')}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    /*
     * Two apps from the same site build, each with its own branding
     * (src/<flavor>/res), links (src/<flavor>/AndroidManifest.xml) and
     * pages (src/<flavor>/assets/public/index.html, written by app-build.mjs:
     * it tells src/lib/native.js which app it is).
     *   home  HomeSite: the start page, /card, /about, /dash, /maps, the hub …
     *   cult  Cult of black Cats: /cult
     */
    flavorDimensions = ["brand"]
    productFlavors {
        home {
            dimension "brand"
            applicationId hs('homeAppId', 'org.homesite.app')
            resValue "string", "app_name", hs('homeName', 'HomeSite App')
            resValue "string", "package_name", hs('homeAppId', 'org.homesite.app')
            resValue "string", "custom_url_scheme", hs('homeAppId', 'org.homesite.app')
            manifestPlaceholders += [appScheme: hs('homeAppId', 'org.homesite.app')]
            buildConfigField "String", "FLAVOR_NAME", '"home"'
        }
        cult {
            dimension "brand"
            applicationId hs('cultAppId', 'org.homesite.cult')
            resValue "string", "app_name", hs('cultName', 'CultSite App')
            resValue "string", "package_name", hs('cultAppId', 'org.homesite.cult')
            resValue "string", "custom_url_scheme", hs('cultAppId', 'org.homesite.cult')
            manifestPlaceholders += [appScheme: hs('cultAppId', 'org.homesite.cult')]
            buildConfigField "String", "FLAVOR_NAME", '"cult"'
        }
    }
    signingConfigs {
        release {
            def signingPath = homesite.getProperty('signingProperties')
            if (signingPath && file(signingPath).exists()) {
                def signing = new Properties()
                file(signingPath).withReader('UTF-8') { signing.load(it) }
                storeFile file(signing.getProperty('storeFile'))
                storePassword signing.getProperty('storePassword')
                keyAlias signing.getProperty('keyAlias')
                keyPassword signing.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (homesite.getProperty('signingProperties')) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// Push (Firebase): only with the project's google-services.json (copied here by pnpm app:build from app/).
if (hasPush) {
    apply plugin: 'com.google.gms.google-services'
} else {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
