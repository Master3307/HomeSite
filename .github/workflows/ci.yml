# .github/workflows/ci.yml
name: Repository checks

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      discord_smoke_test:
        description: Run the live Discord API smoke test using github-pages environment secrets
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node 22 · lint · syntax · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Every non-fatal check writes combined stdout/stderr to .ci-logs.
      # The finalizer writes output for failed checks to the job summary,
      # then fails the job if one or more checks have failed.
      - name: Create CI log directory
        shell: bash
        run: mkdir -p .ci-logs

      - name: Show toolchain versions
        id: versions
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          {
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "npm=$(npm --version)"
          } >> "$GITHUB_OUTPUT"

          {
            echo "Node.js: $(node --version)"
            echo "pnpm: $(pnpm --version)"
            echo "npm: $(npm --version)"
          } 2>&1 | tee .ci-logs/versions.log

      - name: Validate package manifest and lockfile
        id: manifest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          node --input-type=module <<'NODE' 2>&1 | tee .ci-logs/manifest.log
          import fs from "node:fs";

          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));

          if (!packageJson.packageManager?.startsWith("pnpm@")) {
            throw new Error(
              `Expected a pnpm packageManager field, received "${packageJson.packageManager ?? "missing"}".`,
            );
          }

          if (!fs.existsSync("pnpm-lock.yaml")) {
            throw new Error("pnpm-lock.yaml is missing.");
          }

          if (!fs.existsSync(".oxlintrc.json")) {
            throw new Error(".oxlintrc.json is missing.");
          }

          console.log(`✓ packageManager: ${packageJson.packageManager}`);
          console.log("✓ pnpm-lock.yaml is present.");
          console.log("✓ .oxlintrc.json is present.");
          NODE

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee .ci-logs/install.log

      - name: Check pnpm dependency graph
        id: dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm list --depth 0 2>&1 | tee .ci-logs/dependencies.log

      - name: Verify critical package resolution
        id: package-resolution
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          node --input-type=module <<'NODE' 2>&1 | tee .ci-logs/package-resolution.log
          const requiredPackages = [
            "vite",
            "react",
            "react-dom",
            "discord.js",
            "@discordjs/rest",
            "discord-api-types/v10",
            "dotenv",
            "sharp",
            "canvas",
          ];

          let failures = 0;

          for (const packageName of requiredPackages) {
            try {
              const resolved = import.meta.resolve(packageName);
              console.log(`✓ ${packageName}: ${resolved}`);
            } catch (error) {
              console.error(`✗ Cannot resolve ${packageName}: ${error.message}`);
              failures += 1;
            }
          }

          if (failures > 0) {
            process.exitCode = 1;
          }
          NODE

      - name: Run Oxlint
        id: oxlint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec oxlint . 2>&1 | tee .ci-logs/oxlint.log

      - name: Check JavaScript syntax
        id: syntax
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          {
            mapfile -d '' files < <(
              find . \
                -type d \( -name node_modules -o -name dist -o -name .git \) -prune -o \
                -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print0
            )

            if [ "${#files[@]}" -eq 0 ]; then
              echo "No JavaScript files found."
              exit 0
            fi

            echo "Checking syntax for ${#files[@]} JavaScript files."
            failures=0

            for file in "${files[@]}"; do
              echo "::group::Syntax check: $file"

              if node --check "$file"; then
                echo "✓ Valid syntax: $file"
              else
                failures=1
              fi

              echo "::endgroup::"
            done

            exit "$failures"
          } 2>&1 | tee .ci-logs/syntax.log

      - name: Validate Discord bot structure without starting it
        id: discord-bot-static
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          {
            test -f server/bot.cjs
            node --check server/bot.cjs

            node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const expectedDirectories = [
            "server/events",
            "server/commands",
            "server/interactions",
          ];

          for (const directory of expectedDirectories) {
            if (!fs.existsSync(directory)) {
              console.warn(
                `::warning title=Optional bot directory missing::${directory} does not exist.`,
              );
              continue;
            }

            if (!fs.statSync(directory).isDirectory()) {
              throw new Error(
                `Expected a directory but found something else: ${directory}`,
              );
            }

            console.log(`✓ Directory is valid: ${directory}`);
          }

          for (const dependency of [
            "discord.js",
            "@discordjs/rest",
            "discord-api-types/v10",
            "dotenv",
          ]) {
            require.resolve(dependency);
            console.log(`✓ Resolved bot dependency: ${dependency}`);
          }

          const source = fs.readFileSync(path.join("server", "bot.cjs"), "utf8");

          for (const expectedFragment of [
            "DISCORD_BOT_TOKEN",
            "DISCORD_CLIENT_ID",
            "client.login(token)",
          ]) {
            if (!source.includes(expectedFragment)) {
              throw new Error(
                `server/bot.cjs is missing expected entry-point code: ${expectedFragment}`,
              );
            }
          }

          console.log("✓ Bot entry point passed static validation.");
          console.log(
            "✓ The bot was not started; no Discord login or API request was made.",
          );
          NODE
          } 2>&1 | tee .ci-logs/discord-bot-static.log

      - name: Validate Vite configuration
        id: vite-config
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          {
            node --check vite.config.js
            test -f index.html
            test -d src

            echo "✓ vite.config.js syntax is valid."
            echo "✓ index.html exists."
            echo "✓ src directory exists."
          } 2>&1 | tee .ci-logs/vite-config.log

      - name: Build production site
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run build 2>&1 | tee .ci-logs/build.log

      - name: Validate build output
        id: build-output
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          {
            test -d dist
            test -f dist/index.html
            test -f dist/404.html

            file_count="$(find dist -type f | wc -l | tr -d ' ')"
            size_bytes="$(du -sb dist | awk '{print $1}')"
            size_human="$(du -sh dist | awk '{print $1}')"

            {
              echo "file_count=$file_count"
              echo "size_bytes=$size_bytes"
              echo "size_human=$size_human"
            } >> "$GITHUB_OUTPUT"

            echo "✓ dist contains $file_count files and occupies $size_human."
          } 2>&1 | tee .ci-logs/build-output.log

      - name: Write repository-check summary
        if: always()
        shell: bash
        env:
          VERSIONS: ${{ steps.versions.outcome }}
          MANIFEST: ${{ steps.manifest.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          PACKAGE_RESOLUTION: ${{ steps.package-resolution.outcome }}
          OXLINT: ${{ steps.oxlint.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          DISCORD_BOT_STATIC: ${{ steps.discord-bot-static.outcome }}
          VITE_CONFIG: ${{ steps.vite-config.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BUILD_OUTPUT: ${{ steps.build-output.outcome }}
        run: |
          set -euo pipefail

          icon() {
            case "$1" in
              success) printf "✅" ;;
              failure) printf "❌" ;;
              cancelled) printf "🟡" ;;
              skipped) printf "⚪" ;;
              *) printf "❔" ;;
            esac
          }

          label() {
            case "$1" in
              success) printf "Passed" ;;
              failure) printf "Failed" ;;
              cancelled) printf "Cancelled" ;;
              skipped) printf "Skipped" ;;
              *) printf "Unknown" ;;
            esac
          }

          check_names=(
            versions
            manifest
            install
            dependencies
            package-resolution
            oxlint
            syntax
            discord-bot-static
            vite-config
            build
            build-output
          )

          check_labels=(
            "Toolchain versions"
            "Package manifest and lockfile"
            "Dependency installation"
            "pnpm dependency graph"
            "Critical package resolution"
            "Oxlint"
            "JavaScript syntax"
            "Discord bot static validation"
            "Vite configuration"
            "Production build"
            "Build output"
          )

          check_outcomes=(
            "$VERSIONS"
            "$MANIFEST"
            "$INSTALL"
            "$DEPENDENCIES"
            "$PACKAGE_RESOLUTION"
            "$OXLINT"
            "$SYNTAX"
            "$DISCORD_BOT_STATIC"
            "$VITE_CONFIG"
            "$BUILD"
            "$BUILD_OUTPUT"
          )

          {
            echo "# Repository checks"
            echo
            echo "| Status | Check | Result |"
            echo "| :---: | --- | --- |"

            for index in "${!check_names[@]}"; do
              echo "| $(icon "${check_outcomes[$index]}") | ${check_labels[$index]} | $(label "${check_outcomes[$index]}") |"
            done

            echo

            has_failures=false

            for index in "${!check_names[@]}"; do
              if [ "${check_outcomes[$index]}" != "failure" ]; then
                continue
              fi

              has_failures=true
              log_file=".ci-logs/${check_names[$index]}.log"

              echo "## ❌ ${check_labels[$index]}"
              echo
              echo '```text'

              if [ -s "$log_file" ]; then
                cat "$log_file"
              else
                echo "No captured output was produced by this check."
              fi

              echo '```'
              echo
            done

            if [ "$has_failures" = false ]; then
              echo "## ✅ All repository checks passed"
              echo
              echo "No failed-check output to report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when a repository check failed
        if: always()
        shell: bash
        env:
          VERSIONS: ${{ steps.versions.outcome }}
          MANIFEST: ${{ steps.manifest.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          PACKAGE_RESOLUTION: ${{ steps.package-resolution.outcome }}
          OXLINT: ${{ steps.oxlint.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          DISCORD_BOT_STATIC: ${{ steps.discord-bot-static.outcome }}
          VITE_CONFIG: ${{ steps.vite-config.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BUILD_OUTPUT: ${{ steps.build-output.outcome }}
        run: |
          set -euo pipefail

          outcomes=(
            "$VERSIONS"
            "$MANIFEST"
            "$INSTALL"
            "$DEPENDENCIES"
            "$PACKAGE_RESOLUTION"
            "$OXLINT"
            "$SYNTAX"
            "$DISCORD_BOT_STATIC"
            "$VITE_CONFIG"
            "$BUILD"
            "$BUILD_OUTPUT"
          )

          for outcome in "${outcomes[@]}"; do
            if [ "$outcome" = "failure" ]; then
              echo "One or more repository checks failed. See the job summary for complete captured output."
              exit 1
            fi
          done

  discord-smoke-test:
    name: Discord API smoke test
    needs: checks
    if: >-
      ${{ always() &&
          github.event_name == 'workflow_dispatch' &&
          inputs.discord_smoke_test == true }}
    runs-on: ubuntu-latest
    environment: github-pages

    permissions:
      contents: read

    steps:
      - name: Validate configured Discord secrets and variables
        id: configuration
        shell: bash
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_USER_ID: ${{ vars.DISCORD_USER_ID }}
          DISCORD_REDIRECT_URI: ${{ vars.DISCORD_REDIRECT_URI }}
          VITE_DISCORD_API_URL: ${{ vars.VITE_DISCORD_API_URL }}
        run: |
          set -euo pipefail

          test -n "$DISCORD_BOT_TOKEN"
          test -n "$DISCORD_CLIENT_ID"
          test -n "$DISCORD_USER_ID"

          {
            echo "discord_user_id=$DISCORD_USER_ID"
            echo "discord_redirect_uri=${DISCORD_REDIRECT_URI:-not configured}"
            echo "discord_api_url=${VITE_DISCORD_API_URL:-not configured}"
          } >> "$GITHUB_OUTPUT"

          echo "✓ DISCORD_BOT_TOKEN is available."
          echo "✓ DISCORD_CLIENT_ID is available."
          echo "✓ DISCORD_USER_ID is available."
          echo "✓ Environment variables were loaded."

      - name: Verify bot token with Discord
        id: bot-identity
        shell: bash
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          EXPECTED_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          set -euo pipefail

          response="$(mktemp)"

          status="$(
            curl \
              --silent \
              --show-error \
              --output "$response" \
              --write-out "%{http_code}" \
              --header "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
              --header "User-Agent: HomeSite-CI-Discord-Smoke-Test (https://github.com/Master3307/HomeSite, 1.0)" \
              "https://discord.com/api/v10/users/@me"
          )"

          if [ "$status" != "200" ]; then
            echo "::error title=Discord bot token rejected::Discord returned HTTP ${status} for GET /users/@me."
            cat "$response"
            exit 1
          fi

          bot_id="$(
            node -e \
              'const fs=require("fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).id)' \
              "$response"
          )"

          bot_username="$(
            node -e \
              'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); console.log(d.username)' \
              "$response"
          )"

          if [ "$bot_id" != "$EXPECTED_CLIENT_ID" ]; then
            echo "::error title=Discord application mismatch::Token belongs to application ${bot_id}, but DISCORD_CLIENT_ID is ${EXPECTED_CLIENT_ID}."
            exit 1
          fi

          {
            echo "bot_id=$bot_id"
            echo "bot_username=$bot_username"
          } >> "$GITHUB_OUTPUT"

          echo "✓ Bot token is valid."
          echo "✓ Authenticated bot: ${bot_username} (${bot_id})."

      - name: Verify configured Discord user can be fetched
        id: user-lookup
        shell: bash
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ vars.DISCORD_USER_ID }}
        run: |
          set -euo pipefail

          response="$(mktemp)"

          status="$(
            curl \
              --silent \
              --show-error \
              --output "$response" \
              --write-out "%{http_code}" \
              --header "Authorization: Bot ${DISCORD_BOT_TOKEN}" \
              --header "User-Agent: HomeSite-CI-Discord-Smoke-Test (https://github.com/Master3307/HomeSite, 1.0)" \
              "https://discord.com/api/v10/users/${DISCORD_USER_ID}"
          )"

          if [ "$status" != "200" ]; then
            echo "::error title=Discord user lookup failed::Discord returned HTTP ${status} for the configured DISCORD_USER_ID."
            cat "$response"
            exit 1
          fi

          username="$(
            node -e \
              'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); console.log(d.global_name || d.username)' \
              "$response"
          )"

          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "✓ Configured Discord user was fetched: ${username}."

      - name: Write Discord smoke-test summary
        if: always()
        shell: bash
        env:
          CONFIGURATION: ${{ steps.configuration.outcome }}
          BOT_IDENTITY: ${{ steps.bot-identity.outcome }}
          USER_LOOKUP: ${{ steps.user-lookup.outcome }}
          BOT_ID: ${{ steps.bot-identity.outputs.bot_id }}
          BOT_USERNAME: ${{ steps.bot-identity.outputs.bot_username }}
          DISCORD_USER_ID: ${{ steps.configuration.outputs.discord_user_id }}
          DISCORD_USERNAME: ${{ steps.user-lookup.outputs.username }}
        run: |
          set -o pipefail

          icon() {
            case "$1" in
              success) printf "✅" ;;
              failure) printf "❌" ;;
              cancelled) printf "🟡" ;;
              skipped) printf "⚪" ;;
              *) printf "❔" ;;
            esac
          }

          label() {
            case "$1" in
              success) printf "Passed" ;;
              failure) printf "Needs attention" ;;
              cancelled) printf "Cancelled" ;;
              skipped) printf "Skipped" ;;
              *) printf "Unknown" ;;
            esac
          }

          {
            echo "# 🤖 Discord API smoke test"
            echo
            echo "> Uses the protected \`github-pages\` environment. Secret values are never displayed."
            echo
            echo "| Status | Check | Result |"
            echo "| :---: | --- | --- |"
            echo "| $(icon "$CONFIGURATION") | Environment configuration | $(label "$CONFIGURATION") |"
            echo "| $(icon "$BOT_IDENTITY") | Bot token and application identity | $(label "$BOT_IDENTITY") |"
            echo "| $(icon "$USER_LOOKUP") | Configured user lookup | $(label "$USER_LOOKUP") |"
            echo
            echo "## Verified data"
            echo
            echo '```text'
            echo "Bot         : ${BOT_USERNAME:-unavailable} (${BOT_ID:-unavailable})"
            echo "Discord user: ${DISCORD_USERNAME:-unavailable} (${DISCORD_USER_ID:-unavailable})"
            echo "Environment : github-pages"
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
