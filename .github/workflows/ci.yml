name: Repository checks

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Node 22 · lint · syntax · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Show toolchain versions
        id: versions
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          {
            echo "node=$(node --version)"
            echo "pnpm=$(pnpm --version)"
            echo "npm=$(npm --version)"
          } >> "$GITHUB_OUTPUT"

          echo "Node.js: $(node --version)"
          echo "pnpm: $(pnpm --version)"
          echo "npm: $(npm --version)"

      - name: Validate package manifest and lockfile
        id: manifest
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));

          if (packageJson.packageManager !== "pnpm@12.3.4") {
            throw new Error(
              `Expected packageManager to be "pnpm@12.3.4", received "${packageJson.packageManager ?? "missing"}".`,
            );
          }

          if (!fs.existsSync("pnpm-lock.yaml")) {
            throw new Error("pnpm-lock.yaml is missing.");
          }

          if (!fs.existsSync(".oxlintrc.json")) {
            throw new Error(".oxlintrc.json is missing.");
          }

          console.log("✓ package.json is valid.");
          console.log("✓ pnpm-lock.yaml is present.");
          console.log("✓ .oxlintrc.json is present.");
          NODE

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile

      - name: Check pnpm dependency graph
        id: dependencies
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm list --depth 0

      - name: Verify critical package resolution
        id: package-resolution
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          node --input-type=module <<'NODE'
          const requiredPackages = [
            "vite",
            "react",
            "react-dom",
            "discord.js",
            "@discordjs/rest",
            "discord-api-types/v10",
            "dotenv",
            "sharp",
            "canvas",
          ];

          let failures = 0;

          for (const packageName of requiredPackages) {
            try {
              const resolved = import.meta.resolve(packageName);
              console.log(`✓ ${packageName}: ${resolved}`);
            } catch (error) {
              console.error(`✗ Cannot resolve ${packageName}: ${error.message}`);
              failures += 1;
            }
          }

          if (failures > 0) {
            process.exitCode = 1;
          }
          NODE

      - name: Run Oxlint
        id: oxlint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm exec oxlint .

      - name: Check JavaScript syntax
        id: syntax
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          mapfile -d '' files < <(
            find . \
              -type d \( -name node_modules -o -name dist -o -name .git \) -prune -o \
              -type f \( -name '*.js' -o -name '*.cjs' -o -name '*.mjs' \) -print0
          )

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No JavaScript files found."
            exit 0
          fi

          echo "Checking syntax for ${#files[@]} JavaScript files."

          failures=0

          for file in "${files[@]}"; do
            echo "::group::Syntax check: $file"

            if node --check "$file"; then
              echo "✓ Valid syntax: $file"
            else
              failures=1
            fi

            echo "::endgroup::"
          done

          exit "$failures"

      - name: Validate Discord bot structure without starting it
        id: discord-bot
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          test -f server/bot.cjs
          node --check server/bot.cjs

          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const expectedDirectories = [
            "server/events",
            "server/commands",
            "server/interactions",
          ];

          for (const directory of expectedDirectories) {
            if (!fs.existsSync(directory)) {
              console.warn(
                `::warning title=Optional bot directory missing::${directory} does not exist.`,
              );
              continue;
            }

            if (!fs.statSync(directory).isDirectory()) {
              throw new Error(
                `Expected a directory but found something else: ${directory}`,
              );
            }

            console.log(`✓ Directory is valid: ${directory}`);
          }

          for (const dependency of [
            "discord.js",
            "@discordjs/rest",
            "discord-api-types/v10",
            "dotenv",
          ]) {
            require.resolve(dependency);
            console.log(`✓ Resolved bot dependency: ${dependency}`);
          }

          const source = fs.readFileSync(path.join("server", "bot.cjs"), "utf8");

          for (const expectedFragment of [
            "DISCORD_BOT_TOKEN",
            "DISCORD_CLIENT_ID",
            "client.login(token)",
          ]) {
            if (!source.includes(expectedFragment)) {
              throw new Error(
                `server/bot.cjs is missing expected entry-point code: ${expectedFragment}`,
              );
            }
          }

          console.log("✓ Bot entry point passed static validation.");
          console.log(
            "✓ The bot was not started; no Discord login or API request was made.",
          );
          NODE

      - name: Validate Vite configuration
        id: vite-config
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          node --check vite.config.js
          test -f index.html
          test -d src

          echo "✓ vite.config.js syntax is valid."
          echo "✓ index.html exists."
          echo "✓ src directory exists."

      - name: Build production site
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm run build

      - name: Validate build output
        id: build-output
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          test -d dist
          test -f dist/index.html
          test -f dist/404.html

          file_count="$(find dist -type f | wc -l | tr -d ' ')"
          size_bytes="$(du -sb dist | awk '{print $1}')"
          size_human="$(du -sh dist | awk '{print $1}')"

          {
            echo "file_count=$file_count"
            echo "size_bytes=$size_bytes"
            echo "size_human=$size_human"
          } >> "$GITHUB_OUTPUT"

          echo "✓ dist contains $file_count files and occupies $size_human."

      - name: Generate CI report
        id: report
        if: always()
        shell: bash
        env:
          VERSIONS: ${{ steps.versions.outcome }}
          MANIFEST: ${{ steps.manifest.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          PACKAGE_RESOLUTION: ${{ steps.package-resolution.outcome }}
          OXLINT: ${{ steps.oxlint.outcome }}
          SYNTAX: ${{ steps.syntax.outcome }}
          DISCORD_BOT: ${{ steps.discord-bot.outcome }}
          VITE_CONFIG: ${{ steps.vite-config.outcome }}
          BUILD: ${{ steps.build.outcome }}
          BUILD_OUTPUT: ${{ steps.build-output.outcome }}
          NODE_VERSION: ${{ steps.versions.outputs.node }}
          PNPM_VERSION: ${{ steps.versions.outputs.pnpm }}
          NPM_VERSION: ${{ steps.versions.outputs.npm }}
          BUILD_FILE_COUNT: ${{ steps.build-output.outputs.file_count }}
          BUILD_SIZE: ${{ steps.build-output.outputs.size_human }}
        run: |
          set -o pipefail

          passed=0
          failed=0
          cancelled=0
          skipped=0
          total=11

          count_status() {
            case "$1" in
              success)
                passed=$((passed + 1))
                ;;
              failure)
                failed=$((failed + 1))
                ;;
              cancelled)
                cancelled=$((cancelled + 1))
                ;;
              skipped)
                skipped=$((skipped + 1))
                ;;
              *)
                skipped=$((skipped + 1))
                ;;
            esac
          }

          status_icon() {
            case "$1" in
              success)
                printf "✅"
                ;;
              failure)
                printf "❌"
                ;;
              cancelled)
                printf "🟡"
                ;;
              skipped)
                printf "⚪"
                ;;
              *)
                printf "❔"
                ;;
            esac
          }

          status_label() {
            case "$1" in
              success)
                printf "Passed"
                ;;
              failure)
                printf "Needs attention"
                ;;
              cancelled)
                printf "Cancelled"
                ;;
              skipped)
                printf "Skipped"
                ;;
              *)
                printf "Unknown"
                ;;
            esac
          }

          count_status "$VERSIONS"
          count_status "$MANIFEST"
          count_status "$INSTALL"
          count_status "$DEPENDENCIES"
          count_status "$PACKAGE_RESOLUTION"
          count_status "$OXLINT"
          count_status "$SYNTAX"
          count_status "$DISCORD_BOT"
          count_status "$VITE_CONFIG"
          count_status "$BUILD"
          count_status "$BUILD_OUTPUT"

          percent=$((passed * 100 / total))
          filled=$((percent / 5))
          empty=$((20 - filled))

          progress_bar=""
          for ((i = 0; i < filled; i++)); do
            progress_bar="${progress_bar}█"
          done

          for ((i = 0; i < empty; i++)); do
            progress_bar="${progress_bar}░"
          done

          if [ "$failed" -eq 0 ] && [ "$cancelled" -eq 0 ] && [ "$skipped" -eq 0 ]; then
            overall_icon="✅"
            overall_label="All checks passed"
            overall_message="The repository passed every configured validation and the production build artifact is ready."
          elif [ "$failed" -gt 0 ]; then
            overall_icon="🟠"
            overall_label="Informational findings detected"
            overall_message="The workflow completed successfully. Some diagnostic checks found issues that are listed below."
          else
            overall_icon="🟡"
            overall_label="Checks incomplete"
            overall_message="The workflow completed successfully, but one or more diagnostics were cancelled, skipped, or did not report a known result."
          fi

          short_sha="${GITHUB_SHA:0:7}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          commit_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          {
            echo "# ${overall_icon} Repository checks"
            echo
            echo "> **${overall_label}** — ${overall_message}"
            echo
            echo "## Overall progress"
            echo
            echo "\`${progress_bar}\` **${percent}%** — ${passed}/${total} checks passed"
            echo
            echo "| ✅ Passed | 🟠 Findings | 🟡 Cancelled | ⚪ Skipped |"
            echo "| ---: | ---: | ---: | ---: |"
            echo "| ${passed} | ${failed} | ${cancelled} | ${skipped} |"
            echo
            echo "## Check matrix"
            echo
            echo "| Status | Check | Result |"
            echo "| :---: | --- | --- |"
            echo "| $(status_icon "$VERSIONS") | Toolchain versions | $(status_label "$VERSIONS") |"
            echo "| $(status_icon "$MANIFEST") | Manifest and lockfile | $(status_label "$MANIFEST") |"
            echo "| $(status_icon "$INSTALL") | Frozen dependency installation | $(status_label "$INSTALL") |"
            echo "| $(status_icon "$DEPENDENCIES") | pnpm dependency graph | $(status_label "$DEPENDENCIES") |"
            echo "| $(status_icon "$PACKAGE_RESOLUTION") | Critical package resolution | $(status_label "$PACKAGE_RESOLUTION") |"
            echo "| $(status_icon "$OXLINT") | Oxlint | $(status_label "$OXLINT") |"
            echo "| $(status_icon "$SYNTAX") | JavaScript syntax | $(status_label "$SYNTAX") |"
            echo "| $(status_icon "$DISCORD_BOT") | Discord bot static validation | $(status_label "$DISCORD_BOT") |"
            echo "| $(status_icon "$VITE_CONFIG") | Vite configuration | $(status_label "$VITE_CONFIG") |"
            echo "| $(status_icon "$BUILD") | Production build | $(status_label "$BUILD") |"
            echo "| $(status_icon "$BUILD_OUTPUT") | Build output | $(status_label "$BUILD_OUTPUT") |"
            echo
            echo "## Environment"
            echo
            echo '```text'
            echo "Repository : ${GITHUB_REPOSITORY}"
            echo "Workflow   : ${GITHUB_WORKFLOW}"
            echo "Event      : ${GITHUB_EVENT_NAME}"
            echo "Ref        : ${GITHUB_REF_NAME}"
            echo "Commit     : ${short_sha}"
            echo "Actor      : ${GITHUB_ACTOR}"
            echo "Runner     : ${RUNNER_OS} (${RUNNER_ARCH})"
            echo "Node.js    : ${NODE_VERSION:-unavailable}"
            echo "pnpm       : ${PNPM_VERSION:-unavailable}"
            echo "npm        : ${NPM_VERSION:-unavailable}"
            echo '```'
            echo
            echo "## Build artifact"
            echo

            if [ "$BUILD_OUTPUT" = "success" ]; then
              echo "| Output directory | Files | Total size | Required Pages files |"
              echo "| --- | ---: | ---: | --- |"
              echo "| \`dist/\` | ${BUILD_FILE_COUNT:-unknown} | ${BUILD_SIZE:-unknown} | \`index.html\`, \`404.html\` ✅ |"
            else
              echo "> 🟠 The \`dist/\` build artifact could not be validated."
            fi

            echo
            echo "## CI behavior"
            echo
            echo "- Every diagnostic check uses \`continue-on-error: true\`."
            echo "- A diagnostic finding does not stop subsequent checks."
            echo "- This workflow is informational: diagnostic failures are reported but do not fail the job."
            echo "- Discord validation is static only: no Discord token is used, no bot logs in, and no API requests are made."
            echo
            echo "<details>"
            echo "<summary>Run metadata</summary>"
            echo
            echo "- [Open this workflow run](${run_url})"
            echo "- [View commit \`${short_sha}\`](${commit_url})"
            echo "- Triggered by \`${GITHUB_ACTOR}\` via \`${GITHUB_EVENT_NAME}\`"
            echo
            echo "</details>"

            if [ "$failed" -gt 0 ]; then
              echo
              echo "<details open>"
              echo "<summary>🟠 Informational findings — where to look</summary>"
              echo

              if [ "$VERSIONS" = "failure" ]; then
                echo "- **Toolchain versions** needs attention. Check Node.js and pnpm setup output."
              fi

              if [ "$MANIFEST" = "failure" ]; then
                echo "- **Manifest and lockfile** needs attention. Check \`package.json\`, \`pnpm-lock.yaml\`, and \`.oxlintrc.json\`."
              fi

              if [ "$INSTALL" = "failure" ]; then
                echo "- **Frozen dependency installation** needs attention. Resolve package or lockfile drift."
              fi

              if [ "$DEPENDENCIES" = "failure" ]; then
                echo "- **pnpm dependency graph** needs attention. Inspect the dependency listing step."
              fi

              if [ "$PACKAGE_RESOLUTION" = "failure" ]; then
                echo "- **Critical package resolution** needs attention. Check package installation and module exports."
              fi

              if [ "$OXLINT" = "failure" ]; then
                echo "- **Oxlint** found code-quality findings. Open the Oxlint step log for exact files and rules."
              fi

              if [ "$SYNTAX" = "failure" ]; then
                echo "- **JavaScript syntax** needs attention. Open the syntax-check groups to find invalid files."
              fi

              if [ "$DISCORD_BOT" = "failure" ]; then
                echo "- **Discord bot static validation** needs attention. Check \`server/bot.cjs\`, bot folders, and Discord dependencies."
              fi

              if [ "$VITE_CONFIG" = "failure" ]; then
                echo "- **Vite configuration** needs attention. Check \`vite.config.js\`, \`index.html\`, and \`src/\`."
              fi

              if [ "$BUILD" = "failure" ]; then
                echo "- **Production build** needs attention. Check sitemap generation and Vite build output."
              fi

              if [ "$BUILD_OUTPUT" = "failure" ]; then
                echo "- **Build output** needs attention. Confirm \`dist/index.html\` and \`dist/404.html\` are produced."
              fi

              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "passed=$passed"
            echo "failed=$failed"
            echo "cancelled=$cancelled"
            echo "skipped=$skipped"
            echo "total=$total"
            echo "percent=$percent"
          } >> "$GITHUB_OUTPUT"

      - name: Finish informational checks
        if: always()
        shell: bash
        run: |
          echo "Repository checks completed."

          if [ "${{ steps.report.outputs.failed }}" -gt 0 ]; then
            echo "::warning title=Informational CI findings::${{ steps.report.outputs.failed }} diagnostic check(s) need attention. See the job summary."
          fi

          if [ "${{ steps.report.outputs.cancelled }}" -gt 0 ]; then
            echo "::warning title=Incomplete diagnostics::${{ steps.report.outputs.cancelled }} check(s) were cancelled."
          fi

          if [ "${{ steps.report.outputs.skipped }}" -gt 0 ]; then
            echo "::warning title=Skipped diagnostics::${{ steps.report.outputs.skipped }} check(s) were skipped."
          fi

          echo "This informational workflow intentionally exits successfully."
          exit 0
