name: Update self-hosted fonts

on:
  push:
    branches: ["master"]
    paths-ignore:
      - "public/fonts/**"
      - "src/styles/google-sans-flex.css"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-self-hosted-fonts
  cancel-in-progress: false

jobs:
  update:
    name: Scan and update font assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Scan and update self-hosted fonts
        run: pnpm fonts:update

      - name: Commit updated font assets
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: update self-hosted fonts"
          file_pattern: |
            public/fonts/**
            src/styles/google-sans-flex.css

      - name: Deploy updated font assets
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref master
