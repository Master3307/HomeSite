name: General issue
description: Ask a question, share feedback, or report anything else about HomeSite.
title: "[General]: "
labels: []
assignees:
  - Master3307
projects:
  - Master3307/2

body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Site
        - Backend
        - Both
    validations:
      required: true

  - type: textarea
    id: message
    attributes:
      label: What's on your mind?
      description: Ask a question, share feedback, or describe the issue.
      placeholder: Tell us what you need...
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else? (optional)
      description: Add screenshots, logs, links, or other context.
    validations:
      required: false
